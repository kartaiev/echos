# Builds the store apps (the built web app inside the Capacitor shells) on every pull request, so a change that
# breaks them shows up before it is merged. The iPhone app is launched in a simulator and photographed; the Android
# app is kept as an APK that installs on a phone directly.
name: Native apps

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Build for the simulator
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Launch in a simulator and take a screenshot
        run: |
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
          xcrun simctl install "$device" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" io.github.kartaiev.echos
          sleep 15
          xcrun simctl io "$device" screenshot build/ios-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            build/ios-screenshot.png
            build/ios/Build/Products/Debug-iphonesimulator/App.app

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
